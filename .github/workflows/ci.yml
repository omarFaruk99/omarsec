# Build check only. Runs on pull requests, never touches the server.
# Its job is to stop a broken change from being merged into main.
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build the same image the deploy workflow builds, but do not push it.
      # If the Dockerfile or the site build is broken, this fails and the
      # pull request shows a red X before anyone can merge.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
